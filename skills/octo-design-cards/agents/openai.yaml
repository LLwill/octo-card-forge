interface:
  display_name: "Octo Design Cards"
  short_description: "Create repo-free Octo Adaptive Cards and packages"
  default_prompt: "Use $octo-design-cards to create or update an Octo Adaptive Card, choosing Quick Card mode for one-time messages and Card Package mode for reusable/backend-integrated cards. Detect whether the CLI and a Render Profile are available: Skill-only work may produce Tier 0 standard Adaptive Card JSON but must mark it unverified, while CLI plus a resolved Profile enables discover, validate, verify, and preview. Treat the package root as mutable Draft and versions/<version> as immutable Release; run the release verify gate before handoff. Remove unused contract fields with their samples, and never modify a shared Profile for a single card. Default to repo-free authoring, interpret screenshots and fuzzy requirements, ask only blocking contract/interaction/security questions, and emit final Adaptive Card JSON with assumptions and verification status."

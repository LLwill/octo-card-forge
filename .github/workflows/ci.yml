name: forge-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.0"
  PROFILE_REF: octo-chat@1.2.0-rc.2

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run repo-free Agent smoke
        run: pnpm smoke:repo-free-agent

      - name: Compile and validate every Card sample
        run: pnpm check

      - name: Validate current Render Profile
        run: pnpm cli profile validate "$PROFILE_REF"

      - name: Protect existing Render Profile versions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          manifest=render-profiles/octo-chat/manifest.json
          changed_files="$(git diff --name-only "$BASE_SHA"...HEAD -- render-profiles)"
          if [ -z "$changed_files" ]; then
            exit 0
          fi
          if ! printf '%s\n' "$changed_files" | grep -Fqx "$manifest"; then
            echo "Render Profile changes must include a versioned manifest update" >&2
            exit 1
          fi
          base_version="$(git show "$BASE_SHA:$manifest" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));')"
          head_version="$(node -p "require('./$manifest').version")"
          if [ "$base_version" = "$head_version" ]; then
            echo "Existing Render Profile version is immutable: $base_version" >&2
            exit 1
          fi
          echo "Render Profile version changed: $base_version -> $head_version"

  package:
    name: package
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build immutable package
        run: pnpm cli profile pack "$PROFILE_REF" --output .release

      - name: Inspect package contents
        run: |
          set -euo pipefail
          package_dir=.release/octo-chat-1.2.0-rc.2/package
          tarball=.release/mlt-org-octo-card-profile-octo-chat-1.2.0-rc.2.tgz
          test -f "$tarball"
          test "$(node -p "require('./$package_dir/package.json').name")" = "@mlt-org/octo-card-profile-octo-chat"
          test "$(node -p "require('./$package_dir/package.json').version")" = "1.2.0-rc.2"
          tar -tzf "$tarball" | sort
          sha256sum "$tarball"
          (cd "$package_dir" && npm pack --dry-run)

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: octo-chat-1.2.0-rc.2
          path: |
            .release/mlt-org-octo-card-profile-octo-chat-1.2.0-rc.2.tgz
            .release/octo-chat-1.2.0-rc.2/package/dist/bundle-manifest.json
          if-no-files-found: error
          retention-days: 30

  deploy-artifact:
    name: deploy-artifact
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployable application bundle
        run: pnpm package:deploy

      - name: Inspect deployable bundle
        run: |
          set -euo pipefail
          tarball="$(find .release -maxdepth 1 -name 'octo-card-forge-deploy-*.tgz' -print -quit)"
          test -n "$tarball"
          tar -tzf "$tarball" | sort | tee deploy-package-contents.txt
          grep -Fqx './package.json' deploy-package-contents.txt
          grep -Fqx './dist/server.js' deploy-package-contents.txt
          grep -Fqx './scripts/start-service.mjs' deploy-package-contents.txt
          grep -Fqx './deployment-manifest.json' deploy-package-contents.txt
          sha256sum "$tarball"

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: octo-card-forge-deploy-${{ github.sha }}
          path: .release
          if-no-files-found: error
          retention-days: 30

name: forge-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.0"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve active Render Profile reference
        run: |
          set -euo pipefail
          manifest=render-profiles/octo-chat/manifest.json
          id="$(node -p "require('./$manifest').id")"
          version="$(node -p "require('./$manifest').version")"
          package_name="$(node -p "require('./$manifest').packageName")"
          package_slug="${package_name#@}"
          package_slug="${package_slug//\//-}"
          {
            echo "PROFILE_ID=$id"
            echo "PROFILE_VERSION=$version"
            echo "PROFILE_REF=$id@$version"
            echo "PROFILE_PACKAGE_NAME=$package_name"
            echo "PROFILE_TARBALL=$package_slug-$version.tgz"
          } >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run repo-free Agent smoke
        run: pnpm smoke:repo-free-agent

      - name: Run published consumer smoke
        env:
          CONSUMER_CLI_VERSION: "0.2.0"
          CONSUMER_PROFILE_VERSION: "1.2.0-rc.2"
          CONSUMER_SKILL_VERSION: "0.2.0"
        run: pnpm smoke:published-consumer

      - name: Compile and validate every Card sample
        run: pnpm check

      - name: Validate current Render Profile
        run: pnpm cli profile validate "$PROFILE_REF"

      - name: Protect existing Render Profile versions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-profile-immutability.mjs

  package:
    name: package
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve active Render Profile reference
        run: |
          set -euo pipefail
          manifest=render-profiles/octo-chat/manifest.json
          id="$(node -p "require('./$manifest').id")"
          version="$(node -p "require('./$manifest').version")"
          package_name="$(node -p "require('./$manifest').packageName")"
          package_slug="${package_name#@}"
          package_slug="${package_slug//\//-}"
          {
            echo "PROFILE_ID=$id"
            echo "PROFILE_VERSION=$version"
            echo "PROFILE_REF=$id@$version"
            echo "PROFILE_PACKAGE_NAME=$package_name"
            echo "PROFILE_TARBALL=$package_slug-$version.tgz"
          } >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build immutable package
        run: pnpm cli profile pack "$PROFILE_REF" --output .release

      - name: Inspect package contents
        run: |
          set -euo pipefail
          package_dir=".release/${PROFILE_ID}-${PROFILE_VERSION}/package"
          tarball=".release/${PROFILE_TARBALL}"
          test -f "$tarball"
          test "$(node -p "require('./$package_dir/package.json').name")" = "$PROFILE_PACKAGE_NAME"
          test "$(node -p "require('./$package_dir/package.json').version")" = "$PROFILE_VERSION"
          tar -tzf "$tarball" | sort
          sha256sum "$tarball"
          (cd "$package_dir" && npm pack --dry-run)

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROFILE_ID }}-${{ env.PROFILE_VERSION }}
          path: |
            .release/${{ env.PROFILE_TARBALL }}
            .release/${{ env.PROFILE_ID }}-${{ env.PROFILE_VERSION }}/package/dist/bundle-manifest.json
          if-no-files-found: error
          retention-days: 30

  deploy-artifact:
    name: deploy-artifact
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployable application bundle
        run: pnpm package:deploy

      - name: Inspect deployable bundle
        run: |
          set -euo pipefail
          tarball="$(find .release -maxdepth 1 -name 'octo-card-forge-deploy-*.tgz' -print -quit)"
          test -n "$tarball"
          tar -tzf "$tarball" | sort | tee deploy-package-contents.txt
          grep -Fqx './package.json' deploy-package-contents.txt
          grep -Fqx './dist/server.js' deploy-package-contents.txt
          grep -Fqx './scripts/start-service.mjs' deploy-package-contents.txt
          grep -Fqx './web/install.html' deploy-package-contents.txt
          grep -Fqx './web/install.js' deploy-package-contents.txt
          grep -Fqx './web/install-manifest.json' deploy-package-contents.txt
          grep -Fqx './skills/octo-design-cards/skill-manifest.json' deploy-package-contents.txt
          grep -Fqx './deployment-manifest.json' deploy-package-contents.txt
          sha256sum "$tarball"

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: octo-card-forge-deploy-${{ github.sha }}
          path: .release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  github-delivery:
    name: github-delivery
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Smoke card-check Action
        id: card-check
        uses: ./actions/card-check
        with:
          card-path: cards/docs.access-request
          upload-artifact: "false"
          output-dir: .release/action-smoke/check

      - name: Smoke card-release Action without publishing
        id: card-release
        uses: ./actions/card-release
        with:
          card-path: cards/docs.access-request/versions/0.3.0
          publish: "false"
          output-dir: .release/action-smoke/release

      - name: Repeat card-release preparation
        id: card-release-repeat
        uses: ./actions/card-release
        with:
          card-path: cards/docs.access-request/versions/0.3.0
          publish: "false"
          output-dir: .release/action-smoke/release-repeat

      - name: Verify Action outputs
        env:
          CHECK_ARTIFACT: ${{ steps.card-check.outputs.artifact-file }}
          CHECK_SHA256: ${{ steps.card-check.outputs.artifact-sha256 }}
          RELEASE_ARTIFACT: ${{ steps.card-release.outputs.artifact-file }}
          RELEASE_SHA256: ${{ steps.card-release.outputs.artifact-sha256 }}
          HANDOFF_FILE: ${{ steps.card-release.outputs.handoff-file }}
          HANDOFF_SHA256: ${{ steps.card-release.outputs.handoff-sha256 }}
          RELEASE_TAG: ${{ steps.card-release.outputs.release-tag }}
          REPEAT_RELEASE_SHA256: ${{ steps.card-release-repeat.outputs.artifact-sha256 }}
          REPEAT_HANDOFF_SHA256: ${{ steps.card-release-repeat.outputs.handoff-sha256 }}
        run: |
          set -euo pipefail
          test -f "$CHECK_ARTIFACT"
          test -f "$RELEASE_ARTIFACT"
          test -f "$HANDOFF_FILE"
          test "$(cat "${CHECK_ARTIFACT%.json}.sha256")" = "$CHECK_SHA256"
          test "$(cat "${RELEASE_ARTIFACT%.json}.sha256")" = "$RELEASE_SHA256"
          test "$RELEASE_SHA256" = "$REPEAT_RELEASE_SHA256"
          test "$HANDOFF_SHA256" = "$REPEAT_HANDOFF_SHA256"
          test "$RELEASE_TAG" = "card/docs.access-request/v0.3.0"
          actual_handoff_sha="$(sha256sum "$HANDOFF_FILE" | cut -d' ' -f1)"
          test "$actual_handoff_sha" = "$HANDOFF_SHA256"

name: publish-octo-card-cli

on:
  push:
    tags:
      - octo-card-cli/v*
  workflow_dispatch:
    inputs:
      version:
        description: CLI package version, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-octo-card-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.0"
  NPM_REGISTRY_URL: https://registry.npmjs.org/
  PACKAGE_NAME: "@mlt-org/octo-card-cli"

jobs:
  build:
    name: validate-and-package
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}
      tarball: ${{ steps.metadata.outputs.tarball }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require tag to point to main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Publish tags must point to a commit already merged into main." >&2
            exit 1
          }

      - name: Resolve and verify release metadata
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^octo-card-cli/v(.+)$ ]]; then
              echo "Invalid CLI release tag: $tag" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
          fi
          test "$(node -p "require('./package.json').name")" = "$PACKAGE_NAME"
          test "$(node -p "require('./package.json').version")" = "$version"
          package_slug="${PACKAGE_NAME#@}"
          package_slug="${package_slug//\//-}"
          {
            echo "package_name=$PACKAGE_NAME"
            echo "tarball=$package_slug-$version.tgz"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test
          pnpm check
          pnpm smoke:repo-free-agent

      - name: Build CLI package
        run: pnpm build

      - name: Pack CLI package
        run: pnpm pack --pack-destination .release

      - name: Inspect package contents
        env:
          TARBALL: ${{ steps.metadata.outputs.tarball }}
        run: |
          set -euo pipefail
          test -f ".release/$TARBALL"
          tar -tzf ".release/$TARBALL" | sort
          tar -tzf ".release/$TARBALL" | grep -q '^package/dist/cli.js$'
          tar -tzf ".release/$TARBALL" | grep -q '^package/skills/octo-design-cards/SKILL.md$'
          if tar -tzf ".release/$TARBALL" | grep -q '\.handoff\.zip$'; then
            echo "CLI package must not include handoff ZIP artifacts." >&2
            exit 1
          fi
          if tar -tzf ".release/$TARBALL" | grep -q '^package/cards/'; then
            echo "CLI package must not include card fixtures." >&2
            exit 1
          fi
          if tar -tzf ".release/$TARBALL" | grep -q '^package/render-profiles/'; then
            echo "CLI package must not include Render Profile source." >&2
            exit 1
          fi
          sha256sum ".release/$TARBALL"
          npm pack --dry-run

      - name: Ensure version is unpublished
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          version_url="$(node -e '
            const [registry, name, version] = process.argv.slice(1);
            console.log(`${registry.replace(/\/$/, "")}/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          ' "$NPM_REGISTRY_URL" "$PACKAGE_NAME" "$VERSION")"
          status="$(curl --silent --show-error --output npm-version.json --write-out '%{http_code}' "$version_url")"
          case "$status" in
            404) ;;
            200)
              echo "$PACKAGE_NAME@$VERSION is already published." >&2
              exit 1
              ;;
            *)
              cat npm-version.json >&2
              echo "Unexpected npm registry response: HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: octo-card-cli-package
          path: .release/${{ steps.metadata.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish-npm
    runs-on: ubuntu-latest
    needs: build
    environment: npm-publish
    steps:
      - name: Download validated package
        uses: actions/download-artifact@v5
        with:
          name: octo-card-cli-package
          path: release-artifact

      - name: Set up Node.js and npm authentication
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Recheck version is unpublished
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          version_url="$(node -e '
            const [registry, name, version] = process.argv.slice(1);
            console.log(`${registry.replace(/\/$/, "")}/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          ' "$NPM_REGISTRY_URL" "$PACKAGE_NAME" "$VERSION")"
          status="$(curl --silent --show-error --output npm-version.json --write-out '%{http_code}' "$version_url")"
          case "$status" in
            404) ;;
            200)
              echo "$PACKAGE_NAME@$VERSION is already published." >&2
              exit 1
              ;;
            *)
              cat npm-version.json >&2
              echo "Unexpected npm registry response: HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Publish CLI with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./release-artifact/$TARBALL" --access public --provenance

      - name: Verify published package
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          version_url="$(node -e '
            const [registry, name, version] = process.argv.slice(1);
            console.log(`${registry.replace(/\/$/, "")}/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          ' "$NPM_REGISTRY_URL" "$PACKAGE_NAME" "$VERSION")"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --output npm-version.json --write-out '%{http_code}' "$version_url")"
            if [[ "$status" = 200 ]]; then
              published="$(node -p "JSON.parse(require('fs').readFileSync('npm-version.json', 'utf8')).version")"
              if [[ "$published" = "$VERSION" ]]; then
                echo "$PACKAGE_NAME@$VERSION published successfully."
                exit 0
              fi
            fi
            sleep 10
          done
          cat npm-version.json >&2
          echo "Package was published but exact-version verification did not converge (HTTP $status)." >&2
          exit 1

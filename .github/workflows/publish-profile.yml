name: publish-render-profile

on:
  push:
    tags:
      - render-profile/*/v*
  workflow_dispatch:
    inputs:
      profile_ref:
        description: Render Profile reference, for example octo-chat@1.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-render-profile-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.0"
  NPM_REGISTRY_URL: https://registry.npmjs.org/

jobs:
  build:
    name: validate-and-package
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}
      profile_ref: ${{ steps.metadata.outputs.profile_ref }}
      tarball: ${{ steps.metadata.outputs.tarball }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require tag to point to main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Publish tags must point to a commit already merged into main." >&2
            exit 1
          }

      - name: Resolve and verify release metadata
        id: metadata
        env:
          REQUESTED_PROFILE_REF: ${{ inputs.profile_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]]; then
            if [[ ! "$REQUESTED_PROFILE_REF" =~ ^([^@/]+)@(.+)$ ]]; then
              echo "Invalid Render Profile reference: $REQUESTED_PROFILE_REF" >&2
              exit 1
            fi
            profile_id="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^render-profile/([^/]+)/v(.+)$ ]]; then
              echo "Invalid Render Profile tag: $tag" >&2
              exit 1
            fi
            profile_id="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          fi
          profile_ref="$profile_id@$version"
          manifest="render-profiles/$profile_id/$version/manifest.json"
          test -f "$manifest"
          test "$(node -p "require('./$manifest').id")" = "$profile_id"
          test "$(node -p "require('./$manifest').version")" = "$version"
          package_name="$(node -p "require('./$manifest').packageName")"
          test "$package_name" = "@mlt-org/octo-card-profile-octo-chat"
          package_slug="${package_name#@}"
          package_slug="${package_slug//\//-}"
          {
            echo "package_name=$package_name"
            echo "profile_ref=$profile_ref"
            echo "tarball=$package_slug-$version.tgz"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        env:
          PROFILE_REF: ${{ steps.metadata.outputs.profile_ref }}
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test
          pnpm check
          pnpm cli profile validate "$PROFILE_REF"
          pnpm cli profile pack "$PROFILE_REF" --output .release

      - name: Ensure version is unpublished
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          output="$(npm view "$PACKAGE_NAME@$VERSION" version --registry "$NPM_REGISTRY_URL" 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "$PACKAGE_NAME@$VERSION is already published." >&2
            exit 1
          fi
          if [[ "$output" != *"E404"* ]]; then
            echo "$output" >&2
            exit 1
          fi

      - name: Record artifact checksum
        env:
          TARBALL: ${{ steps.metadata.outputs.tarball }}
        run: sha256sum ".release/$TARBALL"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: render-profile-package
          path: |
            .release/${{ steps.metadata.outputs.tarball }}
            .release/octo-chat-${{ steps.metadata.outputs.version }}/package/dist/bundle-manifest.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish-npm
    runs-on: ubuntu-latest
    needs: build
    environment: npm-publish
    steps:
      - name: Download validated package
        uses: actions/download-artifact@v5
        with:
          name: render-profile-package
          path: release-artifact

      - name: Set up Node.js and npm authentication
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Recheck version is unpublished
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          output="$(npm view "$PACKAGE_NAME@$VERSION" version --registry "$NPM_REGISTRY_URL" 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "$PACKAGE_NAME@$VERSION is already published." >&2
            exit 1
          fi
          if [[ "$output" != *"E404"* ]]; then
            echo "$output" >&2
            exit 1
          fi

      - name: Publish RC with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./release-artifact/$TARBALL" --tag next --access public --provenance

      - name: Verify published package
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "$PACKAGE_NAME@$VERSION" version --registry "$NPM_REGISTRY_URL" 2>/dev/null || true)"
            if [[ "$published" = "$VERSION" ]]; then
              echo "$PACKAGE_NAME@$VERSION published successfully."
              exit 0
            fi
            sleep 10
          done
          echo "Package was published but registry verification did not converge." >&2
          exit 1

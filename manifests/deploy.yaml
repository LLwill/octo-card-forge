# octo-card-forge K8s manifest.
# GitLab CI renders this file, pushes it to deploy-files, and ArgoCD syncs it.
#
# Placeholders:
#   {{REPO_URL}}              image repository without tag or digest
#   {{IMAGE_DIGEST}}          immutable Forge image digest
#   {{CATALOG_REPO_URL}}      Catalog image repository without tag or digest
#   {{CATALOG_IMAGE_DIGEST}}  immutable Catalog data image digest
#   {{CATALOG_REVISION}}      Catalog source commit
#   {{FORGE_REVISION}}        Forge source commit
#   {{BASE_PATH}}             optional public URL prefix, empty for root
#   {{BRANCH}}                environment name (currently always "prod")
#
# Stateless HTTP service: reads an immutable Catalog bundle prepared by the
# Catalog data-image initContainer.
#
# `replicas` is intentionally omitted so `kubectl scale` sticks across ArgoCD
# syncs (ArgoCD only reconciles fields present in git); defaults to 1.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octo-card-forge-{{BRANCH}}
  labels:
    app: octo-card-forge
    app.kubernetes.io/name: octo-card-forge
    octo.card-forge/env: "{{BRANCH}}"
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: octo-card-forge
      octo.card-forge/env: "{{BRANCH}}"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: octo-card-forge
        app.kubernetes.io/name: octo-card-forge
        octo.card-forge/env: "{{BRANCH}}"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: tcr-image-xtiao
      terminationGracePeriodSeconds: 30
      volumes:
        - name: catalog-data
          emptyDir:
            sizeLimit: 256Mi
      initContainers:
        - name: prepare-catalog
          image: "{{CATALOG_REPO_URL}}@{{CATALOG_IMAGE_DIGEST}}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: catalog-data
              mountPath: /catalog-data
      containers:
        - name: octo-card-forge
          image: "{{REPO_URL}}@{{IMAGE_DIGEST}}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4318
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4318"
            - name: BASE_PATH
              value: "{{BASE_PATH}}"
            - name: CATALOG_ROOT
              value: "/app/catalog"
            - name: CATALOG_IMAGE_DIGEST
              value: "{{CATALOG_IMAGE_DIGEST}}"
            - name: CATALOG_REVISION
              value: "{{CATALOG_REVISION}}"
            - name: FORGE_REVISION
              value: "{{FORGE_REVISION}}"
          volumeMounts:
            - name: catalog-data
              mountPath: /app/catalog
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: octo-card-forge-{{BRANCH}}
  labels:
    app: octo-card-forge
    app.kubernetes.io/name: octo-card-forge
    octo.card-forge/env: "{{BRANCH}}"
spec:
  type: ClusterIP
  selector:
    app: octo-card-forge
    octo.card-forge/env: "{{BRANCH}}"
  ports:
    - name: http
      port: 4318
      targetPort: 4318

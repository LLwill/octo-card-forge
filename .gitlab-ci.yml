# octo-card-forge CI/CD — single "prod" environment (no dev/test split):
#   build (MR only) -> package (docker build+push to TCR, emit digest)
#   -> sync (render manifests/deploy.yaml, push to deploy-files) -> deploy (ArgoCD sync)
#   -> notify.
#
# Git tags release Forge, Catalog triggers release Catalog, and a manual
# PIPELINE_MODE=bootstrap run creates the first dual-image deployment. ArgoCD
# sync remains the manual production deployment gate after deploy-files is updated.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "catalog"'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "bootstrap"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "bootstrap"'

stages:
  - build
  - package
  - sync
  - deploy
  - smoke
  - notify

variables:
  APP_NAME: octo-card-forge
  REPOSITORY: tbj7-xtiao-tcr1.tencentcloudcr.com
  CONTAINER_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/dmwork/octo-card-forge
  CATALOG_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/dmwork/octo-card-catalog
  DEPLOY_FILES_REPO: code.mlamp.cn/dm-fa/infra/deploy-files.git
  FF_USE_FASTZIP: "true"
  ROBOT_PUSH_MESSAGE: "enable"

  NODE_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/xtiao-release/node:22-alpine
  DOCKER_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/xtiao-release/docker:20.10.17
  GIT_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/xtiao-release/alpine/git:v2.30.2
  CURL_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/xtiao-release/alpine/curl:8.11.1
  NPM_REGISTRY: https://registry.npmmirror.com
  PNPM_VERSION: "10.32.0"
  ARGOCD_SERVER: argocd-server.argocd:80
  ARGOCD_APP: octo-card-forge-prod

build:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "bootstrap"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "bootstrap"'
  tags:
    - tke-deepmining-runner
  image: $NODE_IMAGE
  before_script:
    - npm config set registry "$NPM_REGISTRY"
    - npm install -g "pnpm@${PNPM_VERSION}" --force
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm test
    - pnpm build

resolve_forge_builder:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "catalog"'
  tags:
    - tke-deepmining-runner
  image: $GIT_IMAGE
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -eu
      DEPLOY_REPO_URL="https://__token__:${CODE_TOKEN}@${DEPLOY_FILES_REPO}"
      git clone -b "$APP_NAME-prod" --depth 1 --single-branch "$DEPLOY_REPO_URL" deployed
      FORGE_BUILDER_IMAGE=$(awk -v repo="$CONTAINER_IMAGE" '
        $1 == "image:" {
          gsub(/"/, "", $2)
          prefix = repo "@"
          if (index($2, prefix) == 1) { print $2; exit }
        }
      ' deployed/manifests/deploy.yaml)
      printf '%s' "$FORGE_BUILDER_IMAGE" | grep -Eq '^.+@sha256:[0-9a-f]{64}$' || {
        echo "Current Forge deployment image is missing or is not pinned by digest"
        exit 1
      }
      echo "FORGE_BUILDER_IMAGE=$FORGE_BUILDER_IMAGE" | tee forge-builder.env
  artifacts:
    reports:
      dotenv: forge-builder.env

package_tags:
  stage: package
  only:
    - tags
  tags:
    - tke-deepmining-runner
  image: $DOCKER_IMAGE
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    PUSH_IMAGE_PATH: $CONTAINER_IMAGE:$CI_COMMIT_TAG
  before_script:
    - i=0; while [ "$i" -lt 12 ]; do docker info && break; sleep 5; i=$(( i + 1 )) ; done
    - echo "$HARBOR_PWD" | docker login "$REPOSITORY" -u 100028731872 --password-stdin
  script:
    - sh scripts/ci/build-forge-image.sh package.env
  artifacts:
    reports:
      dotenv: package.env

package_catalog:
  stage: package
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "catalog"'
  tags:
    - tke-deepmining-runner
  image: $DOCKER_IMAGE
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - i=0; while [ "$i" -lt 12 ]; do docker info && break; sleep 5; i=$(( i + 1 )) ; done
    - echo "$HARBOR_PWD" | docker login "$REPOSITORY" -u 100028731872 --password-stdin
  script:
    - sh scripts/ci/build-catalog-image.sh catalog-package.env
  artifacts:
    reports:
      dotenv: catalog-package.env

package_bootstrap:
  stage: package
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "bootstrap"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "bootstrap"'
  tags:
    - tke-deepmining-runner
  image: $DOCKER_IMAGE
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - i=0; while [ "$i" -lt 12 ]; do docker info && break; sleep 5; i=$(( i + 1 )) ; done
    - echo "$HARBOR_PWD" | docker login "$REPOSITORY" -u 100028731872 --password-stdin
  script:
    - printf '%s' "$CATALOG_REVISION" | grep -Eq '^[0-9a-f]{40}$' || { echo "CATALOG_REVISION must be a lowercase 40-character SHA"; exit 1; }
    - export PUSH_IMAGE_PATH="${CONTAINER_IMAGE}:bootstrap-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
    - sh scripts/ci/build-forge-image.sh package.env
    - . ./package.env
    - export FORGE_BUILDER_IMAGE="${CONTAINER_IMAGE}@${IMAGE_DIGEST}"
    - sh scripts/ci/build-catalog-image.sh catalog-package.env
    - cat package.env catalog-package.env > bootstrap-package.env
  artifacts:
    reports:
      dotenv: bootstrap-package.env

sync_code:
  stage: sync
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "bootstrap"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "bootstrap"'
  tags:
    - tke-deepmining-runner
  image: $GIT_IMAGE
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 1
  script:
    - git config --global user.email "ci@mininglamp.com"
    - git config --global user.name "ci"
    - |
      set -e

      if [ -z "$IMAGE_DIGEST" ]; then
        echo "Error: IMAGE_DIGEST is required"
        exit 1
      fi

      TARGET_BRANCH="$APP_NAME-prod"
      DEPLOY_DIR="deploy-repo"
      DEPLOY_REPO_URL="https://__token__:${CODE_TOKEN}@${DEPLOY_FILES_REPO}"
      RELEASE_REF="${CI_COMMIT_TAG:-bootstrap-${CI_COMMIT_SHORT_SHA}}"

      echo "Release: ${RELEASE_REF} -> Deploy branch: $TARGET_BRANCH -> Image: ${CONTAINER_IMAGE} -> Digest: $IMAGE_DIGEST"

      if git clone -b "$TARGET_BRANCH" --depth 1 --single-branch "$DEPLOY_REPO_URL" "$DEPLOY_DIR"; then
        echo "Branch $TARGET_BRANCH exists"
      else
        echo "Branch $TARGET_BRANCH does not exist, creating it"
        git clone --depth 1 "$DEPLOY_REPO_URL" "$DEPLOY_DIR"
        cd "$DEPLOY_DIR"
        git checkout -b "$TARGET_BRANCH"
        cd ..
      fi

      CURRENT_MANIFEST="$DEPLOY_DIR/manifests/deploy.yaml"
      if [ -f "$CURRENT_MANIFEST" ]; then
        CURRENT_CATALOG_IMAGE_DIGEST=$(awk -v repo="$CATALOG_IMAGE" '
          $1 == "image:" {
            gsub(/"/, "", $2)
            prefix = repo "@"
            if (index($2, prefix) == 1) { print substr($2, length(prefix) + 1); exit }
          }
        ' "$CURRENT_MANIFEST")
        CURRENT_CATALOG_REVISION=$(awk '
          $1 == "-" && $2 == "name:" && $3 == "CATALOG_REVISION" {
            getline
            if ($1 == "value:") { gsub(/"/, "", $2); print $2; exit }
          }
        ' "$CURRENT_MANIFEST")
        if grep -Eq '^[[:space:]]*- name: BASE_PATH[[:space:]]*$' "$CURRENT_MANIFEST"; then
          CURRENT_BASE_PATH_CONFIGURED=true
          CURRENT_BASE_PATH=$(awk '
            $1 == "-" && $2 == "name:" && $3 == "BASE_PATH" {
              getline
              if ($1 == "value:") { gsub(/"/, "", $2); print $2; exit }
            }
          ' "$CURRENT_MANIFEST")
        fi
      fi
      if [ "${PIPELINE_MODE:-}" = "bootstrap" ]; then
        CATALOG_IMAGE_DIGEST="${CATALOG_IMAGE_DIGEST:-}"
        CATALOG_REVISION="${CATALOG_REVISION:-}"
      else
        CATALOG_IMAGE_DIGEST="${CURRENT_CATALOG_IMAGE_DIGEST:-${CATALOG_IMAGE_DIGEST:-}}"
        CATALOG_REVISION="${CURRENT_CATALOG_REVISION:-${CATALOG_REVISION:-}}"
      fi
      printf '%s' "$CATALOG_IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "Error: a current or bootstrap CATALOG_IMAGE_DIGEST is required"; exit 1; }
      printf '%s' "$CATALOG_REVISION" | grep -Eq '^[0-9a-f]{40}$' || { echo "Error: a current or bootstrap CATALOG_REVISION is required"; exit 1; }

      if [ "${CURRENT_BASE_PATH_CONFIGURED:-false}" = "true" ]; then
        BASE_PATH="${CURRENT_BASE_PATH:-}"
      else
        BASE_PATH="${DEPLOY_BASE_PATH:-}"
      fi
      if [ -z "$BASE_PATH" ] || [ "$BASE_PATH" = "/" ]; then
        BASE_PATH=""
      else
        case "$BASE_PATH" in
          /*) ;;
          *) BASE_PATH="/$BASE_PATH" ;;
        esac
        while [ "${BASE_PATH%/}" != "$BASE_PATH" ]; do BASE_PATH="${BASE_PATH%/}"; done
        printf '%s' "$BASE_PATH" | grep -Eq '^/([A-Za-z0-9._~-]+/)*[A-Za-z0-9._~-]+$' || { echo "Error: BASE_PATH must be a URL path prefix"; exit 1; }
      fi

      if [ ! -f manifests/deploy.yaml ]; then
        echo "Error: manifests/deploy.yaml not found"
        exit 1
      fi

      mkdir -p "$DEPLOY_DIR/manifests"
      cp manifests/deploy.yaml "$DEPLOY_DIR/manifests/deploy.yaml"

      cd "$DEPLOY_DIR"

      sed -i "s|{{BRANCH}}|prod|g" manifests/deploy.yaml
      sed -i "s|{{REPO_URL}}|${CONTAINER_IMAGE}|g" manifests/deploy.yaml
      sed -i "s|{{IMAGE_DIGEST}}|${IMAGE_DIGEST}|g" manifests/deploy.yaml
      sed -i "s|{{CATALOG_REPO_URL}}|${CATALOG_IMAGE}|g" manifests/deploy.yaml
      sed -i "s|{{CATALOG_IMAGE_DIGEST}}|${CATALOG_IMAGE_DIGEST}|g" manifests/deploy.yaml
      sed -i "s|{{CATALOG_REVISION}}|${CATALOG_REVISION}|g" manifests/deploy.yaml
      sed -i "s|{{FORGE_REVISION}}|${CI_COMMIT_SHA}|g" manifests/deploy.yaml
      sed -i "s|{{BASE_PATH}}|${BASE_PATH}|g" manifests/deploy.yaml

      if grep -q "{{" manifests/deploy.yaml; then
        echo "Error: unresolved placeholder remains after render"
        grep -n "{{" manifests/deploy.yaml
        exit 1
      fi

      git add manifests/deploy.yaml

      if git diff --cached --quiet; then
        echo "No changes to commit"
        exit 0
      fi

      git commit -m "Update octo-card-forge prod to ${RELEASE_REF} (@${IMAGE_DIGEST})"
      git push "$DEPLOY_REPO_URL" "HEAD:$TARGET_BRANCH"

sync_catalog:
  stage: sync
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "catalog"'
  tags:
    - tke-deepmining-runner
  image: $GIT_IMAGE
  variables:
    GIT_STRATEGY: none
  script:
    - git config --global user.email "ci@mininglamp.com"
    - git config --global user.name "ci"
    - |
      set -eu
      test -n "$CATALOG_IMAGE_DIGEST"
      test -n "$CATALOG_REVISION"
      TARGET_BRANCH="$APP_NAME-prod"
      DEPLOY_REPO_URL="https://__token__:${CODE_TOKEN}@${DEPLOY_FILES_REPO}"
      git clone -b "$TARGET_BRANCH" --depth 1 --single-branch "$DEPLOY_REPO_URL" deploy-repo
      cd deploy-repo
      grep -q "image: \"${CATALOG_IMAGE}@sha256:" manifests/deploy.yaml || { echo "Catalog image is not present in the deployed manifest"; exit 1; }
      grep -q "name: CATALOG_IMAGE_DIGEST" manifests/deploy.yaml || { echo "Catalog digest metadata is not present in the deployed manifest"; exit 1; }
      grep -q "name: CATALOG_REVISION" manifests/deploy.yaml || { echo "Catalog revision metadata is not present in the deployed manifest"; exit 1; }
      sed -i -E "s|(image: \"${CATALOG_IMAGE}@)sha256:[0-9a-f]+|\\1${CATALOG_IMAGE_DIGEST}|" manifests/deploy.yaml
      sed -i "/name: CATALOG_IMAGE_DIGEST/{n;s|value: .*|value: \"${CATALOG_IMAGE_DIGEST}\"|;}" manifests/deploy.yaml
      sed -i "/name: CATALOG_REVISION/{n;s|value: .*|value: \"${CATALOG_REVISION}\"|;}" manifests/deploy.yaml
      git add manifests/deploy.yaml
      if git diff --cached --quiet; then echo "Catalog digest is already deployed"; exit 0; fi
      git commit -m "Update octo-card-catalog to ${CATALOG_REVISION} (@${CATALOG_IMAGE_DIGEST})"
      git push "$DEPLOY_REPO_URL" "HEAD:$TARGET_BRANCH"

argocd_sync:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "catalog"'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "bootstrap"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "bootstrap"'
  tags:
    - tke-deepmining-runner
  image: $CURL_IMAGE
  variables:
    GIT_STRATEGY: none
  when: manual
  allow_failure: false
  script:
    - |
      set -e
      test -n "$ARGOCD_TOKEN"
      curl --fail --show-error --silent \
        -X POST "http://$ARGOCD_SERVER/api/v1/applications/$ARGOCD_APP/sync" \
        -H "Authorization: Bearer $ARGOCD_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{"prune":false,"dryRun":false}'

smoke_prod:
  stage: smoke
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "catalog"'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $PIPELINE_MODE == "bootstrap"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "bootstrap"'
  needs:
    - argocd_sync
  tags:
    - tke-deepmining-runner
  image: $CURL_IMAGE
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -e
      if [ -z "${PROD_URL:-}" ]; then
        if [ "${PIPELINE_MODE:-}" = "bootstrap" ]; then
          echo "Skipping external smoke test during bootstrap because PROD_URL is not configured"
          exit 0
        fi
        echo "Error: PROD_URL is required for release smoke testing"
        exit 1
      fi
      i=0
      until curl --fail --show-error --silent "${PROD_URL%/}/readyz" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"'; do
        i=$((i + 1))
        if [ "$i" -ge 30 ]; then exit 1; fi
        sleep 10
      done
      RUNTIME=$(curl --fail --show-error --silent "${PROD_URL%/}/api/v1/runtime")
      printf '%s' "$RUNTIME" | grep -Eq '"mode"[[:space:]]*:[[:space:]]*"published"'
      printf '%s' "$RUNTIME" | grep -Eq '"cards"[[:space:]]*:[[:space:]]*[1-9][0-9]*'
      printf '%s' "$RUNTIME" | grep -Eq '"versions"[[:space:]]*:[[:space:]]*[1-9][0-9]*'
      if [ -n "$CATALOG_REVISION" ]; then printf '%s' "$RUNTIME" | grep -Eq "\"catalogRevision\"[[:space:]]*:[[:space:]]*\"$CATALOG_REVISION\""; fi
      if [ -n "$CATALOG_IMAGE_DIGEST" ]; then printf '%s' "$RUNTIME" | grep -Eq "\"catalogImageDigest\"[[:space:]]*:[[:space:]]*\"$CATALOG_IMAGE_DIGEST\""; fi
      if [ -n "$IMAGE_DIGEST" ]; then printf '%s' "$RUNTIME" | grep -Eq "\"forgeRevision\"[[:space:]]*:[[:space:]]*\"$CI_COMMIT_SHA\""; fi

notify_success:
  stage: notify
  only:
    - tags
  when: on_success
  tags:
    - tke-deepmining-runner
  image: $CURL_IMAGE
  variables:
    GIT_STRATEGY: none
  script: |
    if [ "$ROBOT_PUSH_MESSAGE" = "disable" ]; then exit 0; fi
    MESSAGE="octo-card-forge prod pipeline success\ntag: ${CI_COMMIT_TAG}\ncommit: ${CI_COMMIT_SHORT_SHA}\nimage: ${CONTAINER_IMAGE}@${IMAGE_DIGEST}\npipeline: ${CI_PIPELINE_URL}"
    if [ -n "$DISCORD_WEBHOOK" ]; then
      curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "{\"content\":\"$MESSAGE\"}"
    fi
    if [ -n "$WECOM_WEBHOOK" ]; then
      curl -s -X POST "$WECOM_WEBHOOK" -H "Content-Type: application/json" -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MESSAGE\"}}"
    fi

notify_failure:
  stage: notify
  only:
    - tags
  when: on_failure
  tags:
    - tke-deepmining-runner
  image: $CURL_IMAGE
  variables:
    GIT_STRATEGY: none
  script: |
    if [ "$ROBOT_PUSH_MESSAGE" = "disable" ]; then exit 0; fi
    MESSAGE="octo-card-forge prod pipeline failed\ntag: ${CI_COMMIT_TAG}\ncommit: ${CI_COMMIT_SHORT_SHA}\npipeline: ${CI_PIPELINE_URL}"
    if [ -n "$DISCORD_WEBHOOK" ]; then
      curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "{\"content\":\"$MESSAGE\"}"
    fi
    if [ -n "$WECOM_WEBHOOK" ]; then
      curl -s -X POST "$WECOM_WEBHOOK" -H "Content-Type: application/json" -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MESSAGE\"}}"
    fi
